[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "headliner"
version = "0.1.0"
description = "Polite CLI news-headline aggregator over RSS/Atom feeds and HTML listing pages."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "headliner contributors" }]
keywords = ["news", "rss", "atom", "scraper", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "selectolax>=0.3.21",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
bs4 = ["beautifulsoup4>=4.12", "lxml>=5.0"]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
headliner = "headliner.cli:main"

[project.urls]
Homepage = "https://github.com/okdaithi/093"
Repository = "https://github.com/okdaithi/093"

[tool.setuptools]
packages = ["headliner"]

[tool.setuptools.package-data]
headliner = ["py.typed", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:headliner.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["headliner", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "BLE",  # blind except
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # return
    "ARG",  # unused arguments
    "PTH",  # pathlib
    "RUF",  # ruff-specific
]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Tests hold deliberately odd whitespace (NBSP, zero-width) as input data.
"tests/*" = ["ARG001", "RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["headliner"]

[[tool.mypy.overrides]]
module = ["feedparser", "selectolax.*", "bs4", "respx"]
ignore_missing_imports = true
