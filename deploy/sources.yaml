# Production defaults for the six-hour systemd deployment.
# Replace the contact address before enabling the timer.
settings:
  request_timeout: 20
  rate_limit_seconds: 2
  user_agent: "headliner/0.1 (+https://github.com/okdaithi/093; contact: you@example.com)"
  max_items_per_source: 50
  concurrency: 3

# Tags: a country code for where the outlet is based (AU, IE, UK, US, DE, FR,
# QA, CN, HK, IN, JP, KR, SG, VN), then group and beat tags in lower case
# (galway, asia, markets, business, energy, crypto, commentary). Filter with
# --tag on fetch, list, search, changes and sources. To add sites, see "Adding sources" in the README:
#   headliner discover --tag AU https://example.com.au/ >> new-sources.yaml
sources:
