  - name: ABC News AU
    url: https://www.abc.net.au/news/feed/51120/rss.xml
    type: rss
    tags: [AU]

  - name: The Guardian AU
    url: https://www.theguardian.com/au/rss
    type: rss
    tags: [AU]

  - name: WAtoday
    url: https://www.watoday.com.au/rss/feed.xml
    type: rss
    group: nine
    tags: [AU]

  - name: The West Australian
    url: https://thewest.com.au/feed/
    type: rss
    tags: [AU]

  - name: Sydney Morning Herald
    url: https://www.smh.com.au/rss/feed.xml
    type: rss
    group: nine
    tags: [AU]

  - name: The Age
    url: https://www.theage.com.au/rss/feed.xml
    type: rss
    group: nine
    tags: [AU]

  - name: Australian Financial Review
    url: https://www.afr.com/rss/feed.xml
    type: rss
    group: nine
    tags: [AU, business]

  - name: MacroBusiness
    url: https://www.macrobusiness.com.au/feed/
    type: rss
    tags: [AU, business]

  - name: Capital Brief
    url: https://www.capitalbrief.com/feed/latest.xml
    type: rss
